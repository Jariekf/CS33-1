# McKinsey-style RAG knowledge base manifest.
#
# Each entry must provide EXACTLY ONE of:
#   - url:        a webpage / online PDF, fetched via Jina Reader (r.jina.ai)
#   - local_pdf:  a local PDF, converted via pymupdf4llm
#   - local_path: a local file already in markdown/text form, used as-is
#
# Required:
#   source_type: mckinsey | equity_research | textbook
# Recommended (written into chunk metadata):
#   title: short human-readable title
#   year:  publication year (int)
#
# Workflow:
#   1) python scripts/prepare_mckinsey_md.py   # url + local_pdf -> data/mckinsey_kb/raw/*.md
#   2) python scripts/upload_mckinsey_kb.py    # markdown -> Chroma collection mckinsey_kb


